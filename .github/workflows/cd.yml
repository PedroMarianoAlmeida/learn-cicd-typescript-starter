name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push Docker image
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          gcloud builds submit --tag "us-central1-docker.pkg.dev/${PROJECT_ID}/notely-ar-repo/notely:latest" .

      - name: Run database migrations
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          gcloud run deploy notely --image "us-central1-docker.pkg.dev/${PROJECT_ID}/notely-ar-repo/notely:latest" --region us-central1 --allow-unauthenticated --project "${PROJECT_ID}" --max-instances=4
